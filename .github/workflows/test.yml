name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_termbeat.py
        env:
          PYTHONIOENCODING: utf-8   # the suite prints CJK; Windows CI defaults to cp1252

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tools/export_stations.py --check
      - run: node extension/tests/test_extension.js
      - run: python tools/build_extension.py
      - run: npx --yes web-ext lint --source-dir build/extension/firefox
